name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Android Environment Properties
      run: |
        # 1. تثبيت مسار الفلاتر الأساسي
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

        # 2. ضبط خصائص الجريدل
        cat << 'EOF' > android/gradle.properties
        org.gradle.jvmargs=-Xmx4608m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # 3. إعداد إصدار Gradle Wrapper 8.11.1
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
        EOF

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
