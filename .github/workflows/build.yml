name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get

    - name: Force Android SDK 36 Across All Modules
      run: |
        python3 -c "
        import re
        app_gradle = 'android/app/build.gradle'
        with open(app_gradle, 'r') as f:
            c = f.read()
        c = re.sub(r'compileSdk\s*=.*|compileSdkVersion\s*.*', 'compileSdk = 36', c)
        c = re.sub(r'targetSdk\s*=.*|targetSdkVersion\s*.*', 'targetSdk = 36', c)
        c = re.sub(r'minSdk\s*=.*|minSdkVersion\s*.*', 'minSdk = 21', c)
        with open(app_gradle, 'w') as f:
            f.write(c)

        root_gradle = 'android/build.gradle'
        override_code = '''
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileSdkVersion 36
                    }
                }
            }
        }
        '''
        with open(root_gradle, 'a') as f:
            f.write(override_code)
        "

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
