name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Android Environment & Force V2 Embedding
      run: |
        # 1. تثبيت مسار الفلاتر الأساسي
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

        # 2. ضبط خصائص الجريدل
        cat << 'EOF' > android/gradle.properties
        org.gradle.jvmargs=-Xmx4608m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # 3. إعداد إصدار Gradle Wrapper 8.11.1
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
        EOF

        # 4. إصلاح وتأكيد دعم V2 Embedding تلقائياً منعاً لأي خطأ
        python3 -c "
        import os

        # التأكد من وجود ملف الـ Manifest وتحديثه
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        if os.path.exists(manifest_path):
            with open(manifest_path, 'r') as f:
                content = f.read()
            
            # إزالة أي إعدادات قديمة تعارض الـ v2 إذا وجدت
            if 'flutterEmbedding' not in content:
                content = content.replace('</application>', '    <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n    </application>')
                with open(manifest_path, 'w') as f:
                    f.write(content)
                    print('Injected flutterEmbedding v2 successfully.')

        # التأكد من وجود مجلد الـ Java والـ MainActivity الصحيح
        java_dir = 'android/app/src/main/kotlin/com/example/omar_pos'
        os.makedirs(java_dir, exist_ok=True)
        main_activity = os.path.join(java_dir, 'MainActivity.kt')
        if not os.path.exists(main_activity):
            with open(main_activity, 'w') as f:
                f.write('package com.example.omar_pos\n\nio.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}\n')
                print('Created default MainActivity.kt successfully.')
        "

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
