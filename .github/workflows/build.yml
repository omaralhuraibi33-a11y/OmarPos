name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
 
        - name: Generate Flutter Android Project
      run: |
        if [ -d "lib" ]; then cp -r lib lib_backup; fi
        flutter create --org com.omarpos.master --project-name omar_pos --platforms=android .
        if [ -d "lib_backup" ]; then rm -rf lib && mv lib_backup lib; fi
        

      


    - name: Set Android Min SDK Version
      run: |
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
