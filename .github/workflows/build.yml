name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Flutter Android Project
      run: |
        mkdir -p temp_lib
        cp -r lib/* temp_lib/ 2>/dev/null || true
        flutter create --org com.omarpos.master --project-name omar_pos --platforms=android .
        cp -r temp_lib/* lib/ 2>/dev/null || true
        rm -rf temp_lib

    - name: Set Android Min SDK Version
      run: |
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true

    - name: Get Dependencies
      run: flutter pub upgrade
      

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
