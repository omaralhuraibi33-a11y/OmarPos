name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fix Android Scaffolding & Gradle Version
      run: |
        # إنشاء ملف gradle-wrapper.properties بالإصدار الحديث المعتمد من فلاتر
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-bin.zip
        EOF

        # إنشاء android/build.gradle الرئيسي الصحيح
        cat << 'EOF' > android/build.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }
        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF

        # إنشاء android/app/build.gradle المعتمد
        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace "com.omarpos.master"
            compileSdk 36

            defaultConfig {
                applicationId "com.omarpos.master"
                minSdk 21
                targetSdk 36
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                }
            }
        }

        flutter {
            source '../..'
        }
        EOF

    - name: Force Android SDK 36 Across All Dependencies
      run: |
        python3 -c "
        root_gradle = 'android/build.gradle'
        override_code = '''
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileSdkVersion 36
                    }
                }
            }
        }
        '''
        with open(root_gradle, 'a') as f:
            f.write(override_code)
        "

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
