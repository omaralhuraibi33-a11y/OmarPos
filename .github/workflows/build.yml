name: Build OmarPos Master APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fix Android Scaffolding & Environment
      run: |
        mkdir -p android/gradle/wrapper
        
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

        # تفعيل AndroidX لإنهاء أخطاء المكتبات
        cat << 'EOF' > android/gradle.properties
        org.gradle.jvmargs=-Xmx4608m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        EOF

        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                def propertiesFile = new File(settingsDir, 'local.properties')
                if (propertiesFile.exists()) {
                    propertiesFile.withReader('UTF-8') { reader -> properties.load(reader) }
                }
                def flutterSdkPath = properties.getProperty('flutter.sdk')
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.2.1" apply false
            id "org.jetbrains.kotlin.android" version "1.9.24" apply false
        }

        include ":app"
        EOF

        cat << 'EOF' > android/build.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }
        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace "com.omarpos.master"
            compileSdk 36
            ndkVersion "26.2.11394358"

            defaultConfig {
                applicationId "com.omarpos.master"
                minSdk 21
                targetSdk 36
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                }
            }
        }

        flutter {
            source '../..'
        }
        EOF

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omar-pos-app
        path: build/app/outputs/flutter-apk/app-release.apk
